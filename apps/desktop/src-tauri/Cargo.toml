[package]
name = "thingmaker-desktop"
description = "ThingMaker Tauri host: narrow renderer-facing commands over the native supervisor."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "thingmaker_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "thingmaker-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
thingmaker-voice = { path = "../../../crates/thingmaker-voice" }
thingmaker-appcontainer = { path = "../../../crates/thingmaker-appcontainer" }
thingmaker-supervisor = { path = "../../../crates/thingmaker-supervisor" }
# "unstable" is Tauri's multi-webview support: the artifact panel is a second webview in the main window.
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-notification = "=2.4.0"
# Updates from the GitHub releases, signature-checked against the key in tauri.conf.json.
tauri-plugin-updater = "=2.12.0"
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "=0.2.5"
blake3 = { workspace = true }
tempfile = { workspace = true }
toml = "=1.1.5"
uuid = { workspace = true }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
tokio-util = { version = "=0.7.19", features = ["io"] }
sha2 = "=0.10.9"
tokio-tungstenite = { version = "=0.29.0", features = ["connect", "rustls-tls-native-roots"] }
tower = { version = "=0.5.3", features = ["util"] }
futures-util = "=0.3.34"
base64 = "=0.22.1"
# Real paths without the Windows `\\?\` prefix, which command-line tools such as adb can mishandle.
dunce = "=1.0.5"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std"] }
# The same-Wi-Fi download of an APK: a TLS listener with its own certificate.
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "crypto"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "=1.11.1", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio", "service"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
security-framework = "=3.7.0"
core-foundation = "=0.10.1"
# The Web bridge forwards an agent's tool calls to the web runtime.
reqwest = { version = "=0.13.4", features = ["json"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "=0.13.4", features = ["json"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_JobObjects", "Win32_System_Power", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_UI_WindowsAndMessaging"] }
